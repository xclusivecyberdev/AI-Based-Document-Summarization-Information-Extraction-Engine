version: '3.8'

services:
  web:
    build: .
    container_name: document-ai-platform
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./processed:/app/processed
      - ./logs:/app/logs
      - ./document_platform.db:/app/document_platform.db
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - DATABASE_URL=sqlite:///./document_platform.db
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-key-in-production}
      - DEVICE=cpu
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  uploads:
  processed:
  logs:
